[package]
name = "tumu"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "A terminal multiplexer with stacked sheets"
license = "MIT"
homepage = "https://github.com/sile/tumu"
repository = "https://github.com/sile/tumu"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui"]
categories = ["command-line-utilities"]
exclude = ["backlog/"]

[dependencies]
libc = "0.2"
noargs = "0.4"
termnix = "0.5.3"
tuinix = "0.7"
unicode-width = "0.2"

[dev-dependencies]
noprop = "0.2"
