name: CI

on: [push]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo check --all-targets

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      # The e2e tests spawn a real PTY and drive tumu, so they run against the
      # runner's own terminal. `--all-targets` covers the binary and every test
      # target; the doc tests cover the README and the library docs.
      - run: cargo test --all-targets
      - run: cargo test --doc

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The MSRV is read from `Cargo.toml`'s `rust-version` so it is not
      # duplicated here. Stable is installed first because `cargo metadata`
      # needs a working toolchain to run.
      - name: Read MSRV from Cargo.toml
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          msrv="$(cargo metadata --format-version=1 --no-deps \
            | grep -o '"rust_version":"[^"]*"' \
            | cut -d'"' -f4)"
          test -n "$msrv" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup default "$MSRV"
      - run: cargo build

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
